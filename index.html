<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DailyUp">
  <meta name="theme-color" content="#0f0f0f">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>DailyUp</title>
</head>
<body>
  <div id="app">

    <header class="header">
      <h1 id="page-title">Hoje</h1>
      <div class="header-right">
        <span id="today-date"></span>
        <button id="btn-settings" class="btn-icon" title="Configurações">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <main id="main">

      <!-- Tela: Hoje -->
      <section id="screen-hoje" class="screen active">
        <div id="routines-today"></div>
        <div id="empty-today" class="empty-state hidden">
          <p>Nenhuma rotina ativa.</p>
          <p>Crie uma na aba Rotinas.</p>
        </div>
      </section>

      <!-- Tela: Rotinas -->
      <section id="screen-rotinas" class="screen">
        <div id="routines-list"></div>
        <div id="empty-routines" class="empty-state hidden">
          <p>Nenhuma rotina criada ainda.</p>
        </div>
        <button id="btn-new-routine" class="btn-primary">+ Nova Rotina</button>
      </section>

    </main>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-screen="hoje">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 17h7M17 14v7"/></svg>
        <span>Hoje</span>
      </button>
      <button class="nav-btn" data-screen="rotinas">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        <span>Rotinas</span>
      </button>
    </nav>

  </div>

  <!-- Modal: Nova/Editar Rotina -->
  <div id="modal-backdrop" class="modal-backdrop">
    <div id="modal-routine" class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h2 id="modal-title">Nova Rotina</h2>
        <button id="modal-close" class="btn-icon">✕</button>
      </div>
      <input type="text" id="routine-name-input" placeholder="Nome da rotina" class="input-field">
      <div id="day-picker" class="day-picker">
        <button class="day-btn" data-day="1">Seg</button>
        <button class="day-btn" data-day="2">Ter</button>
        <button class="day-btn" data-day="3">Qua</button>
        <button class="day-btn" data-day="4">Qui</button>
        <button class="day-btn" data-day="5">Sex</button>
        <button class="day-btn" data-day="6">Sáb</button>
        <button class="day-btn" data-day="0">Dom</button>
      </div>
      <div id="routine-items-list"></div>
      <button id="btn-add-item" class="btn-secondary">+ Adicionar passo</button>
      <div class="modal-footer">
        <button id="btn-delete-routine" class="btn-danger hidden">Excluir rotina</button>
        <button id="btn-save-routine" class="btn-primary">Salvar</button>
      </div>
    </div>
  </div>

  <!-- Modal: Configurações -->
  <div id="settings-backdrop" class="modal-backdrop">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h2>Configurações</h2>
        <button id="settings-close" class="btn-icon">✕</button>
      </div>
      <p class="settings-label">Avisar antes (minutos padrão)</p>
      <input type="number" id="settings-notify-before" class="input-field" min="0" max="120" placeholder="10">
      <p class="settings-hint">Usado em todos os itens sem tempo personalizado. Coloque 0 para desativar.</p>
      <div class="modal-footer">
        <button id="btn-save-settings" class="btn-primary">Salvar</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
